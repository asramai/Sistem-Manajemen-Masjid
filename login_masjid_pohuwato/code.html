<body class="bg-background geometric-bg min-h-screen flex items-center justify-center p-md md:p-lg text-on-background font-body-md">
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl p-lg md:p-xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-[#E0E0E0] flex flex-col items-center">
<img alt="Masjid Pohuwato Logo" class="w-[120px] h-auto mb-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe_gKcTyo0BrdRgEa3vtrI8nEMybFRgK5Ky8g0xZBgora-G9DRYqHUFkB0h_-YDII6_pkNdjLKkA4vF3n7u9BRWLrplxEpOKM5ypN6A0FcKQ0Q3lTgDEMyqhGn5KTNe-BeVzf_-ao8b9ipUxEM0dipgVjmiB0aBV3ZkdH8CHPWR3jtcjJ-ZldILIr0IzzW6QSPF2Pjt20pEGUdAm5mhZaxqnp2ulQ9qQT05gsN9OlFP2FEV6IeqFoSYBDRxmJiooDrV6U"/>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs text-center">Selamat Datang</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg text-center">Masjid Pohuwato Management System</p>
<form class="w-full flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email / Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-[40px] pr-sm py-sm rounded-DEFAULT border border-[#E0E0E0] bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="email" name="email" placeholder="Masukkan email atau username" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-[40px] pr-[40px] py-sm rounded-DEFAULT border border-[#E0E0E0] bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors duration-200" id="password" name="password" placeholder="Masukkan password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:text-surface-tint underline decoration-primary/30 hover:decoration-primary transition-all" href="#">Lupa Password?</a>
</div>
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md py-sm rounded-lg transition-colors duration-200 mt-sm" type="submit">
                Masuk
            </button>
<div class="flex justify-center mt-sm">
<a class="font-label-md text-label-md text-primary hover:text-surface-tint underline decoration-primary/30 hover:decoration-primary transition-all" href="#">Daftar Akun Baru</a>
</div>
</form>
</main>
<script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
</body></html>
